- id: vitd
  cat: scientific
  q: "Does vitamin D supplementation reduce the risk of acute respiratory infections, and how strong is the evidence?"
  parts:
    - id: vitd.effect
      type: figure
      text: "Effect of vitamin D supplementation on risk of acute respiratory infection (meta-analytic estimate)"
      ref:
        statement: "Small protective effect: OR 0.92 (95% CI 0.86-0.99; 37 studies) in Jolliffe et al. 2021; the 2025 update gives OR 0.94 (0.88-1.00), no longer significant. Daily dosing subgroup OR 0.78 (2021)."
        value: "OR 0.92 (0.86-0.99)"
        alt_values: ["OR 0.94 (0.88-1.00) (2025 update)", "OR 0.88 (Martineau et al. 2017, BMJ)", "OR 0.78 daily dosing"]
        url: "https://doi.org/10.1016/s2213-8587(21)00051-6"
        quote: "with an OR of 0·92 (95% CI 0·86-0·99; 37 studies; I 2 =35·6%, p heterogeneity =0·018)"
        accessed: "2026-11-25"
        source_class: peer_reviewed
        verified_by: abstract
    - id: vitd.strength
      type: fact
      text: "How strong the evidence is"
      ref:
        statement: "Modest: the overall effect is small and heterogeneous, benefit appears mainly with daily dosing, and the most recent meta-analysis (2025) CI includes 1.00 (not statistically significant)."
        value: null
        alt_values: []
        url: "https://researchonline.lshtm.ac.uk/id/eprint/4677068"
        quote: "the 95% CI for this effect estimate now includes 1·00"
        accessed: "2026-11-25"
        source_class: peer_reviewed
        verified_by: page

- id: cbti
  cat: comparison
  q: "How effective is cognitive behavioural therapy for insomnia compared with sleep medication, according to clinical trials?"
  parts:
    - id: cbti.cbt
      type: fact
      text: "Effectiveness of CBT for insomnia (CBT-I) per trials or guidelines"
      ref:
        statement: "Effective; recommended as initial treatment for chronic insomnia (ACP 2016 guideline: strong recommendation, moderate-quality evidence)."
        value: null
        alt_values: []
        url: "https://doi.org/10.7326/m15-2175"
        quote: "ACP recommends that all adult patients receive cognitive behavioral therapy for insomnia (CBT-I) as the initial treatment for chronic insomnia disorder. (Grade: strong recommendation, moderate-quality evidence)."
        accessed: "2026-11-25"
        source_class: guideline
        verified_by: abstract
    - id: cbti.meds
      type: fact
      text: "Effectiveness of sleep medication per trials"
      ref:
        statement: "Medications work in the short term (very low grade evidence that benzodiazepines are more effective than CBT-I short term), with less durable effects; guidelines reserve them as an add-on (weak recommendation, low-quality evidence)."
        value: null
        alt_values: []
        url: "https://doi.org/10.1186/1471-2296-13-40"
        quote: "very low grade evidence suggests benzodiazepines are more effective in the short term"
        accessed: "2026-11-25"
        source_class: peer_reviewed
        verified_by: abstract
    - id: cbti.cmp
      type: comparison
      text: "CBT-I vs sleep medication on effectiveness, or a reasoned not-comparable statement"
      sides: ["CBT-I", "sleep medication"]
      measure: "effectiveness (short and long term)"
      ref:
        statement: "CBT-I is more effective in the long term (remission OR 1.82, 95% CI 1.15-2.87, high certainty; Furukawa et al. 2024) and at least comparable short term (medication may act faster); effects more durable."
        value: null
        alt_values: ["long-term remission 41% CBT-I vs 28% pharmacotherapy"]
        url: "https://doi.org/10.1111/pcn.13730"
        quote: "CBT-I was more beneficial than pharmacotherapy in the long term (median duration, 24 weeks [range, 12 to 48 weeks]; remission odds ratio, 1.82"
        accessed: "2026-11-25"
        source_class: peer_reviewed
        verified_by: abstract

- id: pm25
  cat: scientific
  q: "What does epidemiological research report about long-term air pollution exposure and dementia risk?"
  parts:
    - id: pm25.assoc
      type: figure
      text: "Reported association between long-term air pollution (e.g. PM2.5) exposure and dementia risk"
      ref:
        statement: "Positive but modest association: overall HR 1.04 (0.99-1.09) per 2 ug/m3 PM2.5; 1.42 (1.00-2.02) in studies with active case ascertainment (Wilker et al. 2023, BMJ). Other meta-analyses report similar positive HRs (e.g. 1.08 per 5 ug/m3)."
        value: "HR 1.04 per 2 ug/m3"
        alt_values: ["HR 1.42 active ascertainment", "HR 1.08 per 5 ug/m3 (Sharp et al. 2025)", "air pollution listed as a modifiable dementia risk factor (Lancet Commission)"]
        url: "https://doi.org/10.1136/bmj-2022-071620"
        quote: "The overall hazard ratio per 2 μg/m 3  PM 2.5  was 1.04 (95% confidence interval 0.99 to 1.09)."
        accessed: "2026-11-25"
        source_class: peer_reviewed
        verified_by: abstract
    - id: pm25.caveats
      type: fact
      text: "Strength/limitations of that evidence"
      ref:
        statement: "Limited and heterogeneous: most studies at high risk of bias; estimates depend on case ascertainment method; association plausible but not established as causal."
        value: null
        alt_values: []
        url: "https://doi.org/10.1136/bmj-2022-071620"
        quote: "Most studies were at high risk of bias, although in many cases bias was towards the null."
        accessed: "2026-11-25"
        source_class: peer_reviewed
        verified_by: abstract

- id: minwage
  cat: contested
  q: "What does economic research find about the effect of minimum wage increases on employment?"
  parts:
    - id: minwage.small
      type: fact
      text: "Research finding little or no employment loss"
      ref:
        statement: "Many modern studies find small or no job losses, e.g. Cengiz et al. (2019, QJE): across 138 state increases the number of low-wage jobs stayed essentially unchanged over five years."
        value: null
        alt_values: ["Card and Krueger (1994) New Jersey fast food: no employment decline"]
        url: "https://www.nber.org/papers/w25434"
        quote: "the overall number of low-wage jobs remained essentially unchanged over five years following the increase"
        accessed: "2026-11-25"
        source_class: peer_reviewed
        verified_by: page
    - id: minwage.negative
      type: fact
      text: "Research finding job losses / the disagreement"
      ref:
        statement: "Other reviews find a preponderance of negative estimates, stronger for teens, young adults and less-educated workers (Neumark and Shirley 2022); the literature remains contested."
        value: null
        alt_values: ["CBO 2019: $15 federal minimum would cost about 1.3 million jobs (median estimate)"]
        url: "https://www.nber.org/papers/w28388"
        quote: "there is a clear preponderance of negative estimates in the literature"
        accessed: "2026-11-25"
        source_class: peer_reviewed
        verified_by: page

- id: leave
  cat: legal
  q: "What are the legal requirements for minimum paid annual leave in France, Brazil and South Korea, including how many days and how pay is calculated?"
  parts:
    - id: leave.fr
      type: fact
      text: "France: minimum days and how leave pay is calculated"
      ref:
        statement: "2.5 working days (jours ouvrables) per month worked = 30 working days (5 weeks) a year; pay is the more favourable of 1/10 of total gross pay in the reference period or salary maintenance."
        value: "30 working days (5 weeks)"
        alt_values: ["25 jours ouvrés", "5 weeks"]
        url: "https://www.service-public.gouv.fr/particuliers/vosdroits/F33359"
        quote: "soit par la règle du 1/10e de la rémunération brute totale, soit par la règle du maintien de salaire"
        accessed: "2026-11-25"
        source_class: government
        verified_by: page
    - id: leave.br
      type: fact
      text: "Brazil: minimum days and how leave pay is calculated"
      ref:
        statement: "30 calendar days after each 12-month period (reduced to 24/18/12 days with more than 5 unjustified absences); pay is normal salary plus at least one third (constitutional 1/3 bonus)."
        value: "30 days + 1/3 bonus"
        alt_values: []
        url: "https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"
        quote: "gozo de férias anuais remuneradas com, pelo menos, um terço a mais do que o salário normal"
        accessed: "2026-11-25"
        source_class: government
        verified_by: page
    - id: leave.kr
      type: fact
      text: "South Korea: minimum days and how leave pay is calculated"
      ref:
        statement: "15 days after one year with at least 80% attendance; 1 day per month worked before that; +1 day per 2 years of service after the first year (from the 3rd year), capped at 25 days; paid at ordinary wages or average wages (Labor Standards Act Art. 60)."
        value: "15 days (max 25)"
        alt_values: ["11 days in the first year (1 per month)"]
        url: "https://www.crowe.com/kr/en-us/news/news20180601_en"
        quote: "15 days of paid annual leave if the employees fulfilled at least 80% attendance during one (1) year"
        accessed: "2026-11-25"
        source_class: professional_secondary
        verified_by: snippet

- id: heat
  cat: comparison
  q: "How much does it cost to run a heat pump compared with a gas boiler in the UK?"
  parts:
    - id: heat.drivers
      type: fact
      text: "What determines heat pump running cost relative to gas (electricity-to-gas price ratio, heat pump efficiency)"
      ref:
        statement: "Depends on the electricity-to-gas unit price ratio (about 3.3-4 under recent UK price caps) and the heat pump's seasonal efficiency (SCOP ~2.9-3.5) vs a boiler's ~85-92%; tariff choice matters."
        value: null
        alt_values: []
        url: "https://www.nesta.org.uk/report/how-the-energy-crisis-affects-the-case-for-heat-pumps/"
        quote: "the ratio of electricity to gas prices is due to be around 3.3 from October 2022"
        accessed: "2026-11-25"
        source_class: research_org
        verified_by: page
    - id: heat.annual
      type: figure
      text: "An annual running-cost figure for a heat pump and for a gas boiler (stated period)"
      ref:
        statement: "Any dated annual figure for both technologies from a cited saved source (e.g. at the July 2025 cap: about £630 gas boiler vs about £735 air-source heat pump for a typical home). Grade by the source-backed rule; numbers vary by cap period."
        value: null
        alt_values: ["£630 boiler vs £735 heat pump (July 2025 cap example)"]
        url: "https://www.granddesignsmagazine.com/advice/how-much-does-a-heat-pump-cost-to-run"
        quote: "£630.20"
        accessed: "2026-11-25"
        source_class: press
        verified_by: snippet
    - id: heat.cmp
      type: comparison
      text: "Heat pump vs gas boiler on annual running cost in the UK, or a reasoned not-comparable statement"
      sides: ["heat pump", "gas boiler"]
      measure: "annual running cost"
      ref:
        statement: "Broadly similar at standard capped tariffs: an efficient heat pump (SCOP about 2.9-3.1 or higher) matches or beats a gas boiler; a less efficient one costs somewhat more; heat-pump/time-of-use tariffs make it cheaper."
        value: null
        alt_values: []
        url: "https://www.which.co.uk/news/article/a-heat-pump-might-be-a-lot-cheaper-than-you-think-heres-how-aSx7P0B2hOHW"
        quote: "the running costs for a heat pump can match or beat the costs for a gas boiler"
        accessed: "2026-11-25"
        source_class: consumer_org
        verified_by: page
