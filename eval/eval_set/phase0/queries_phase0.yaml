      ref:
        statement: "Ireland's unemployment rose much higher (about double Iceland's peak: ~15% vs ~7.5%) and stayed high longer; Iceland's peaked in 2010 and fell from 2011."
        value: null
        alt_values: []
        url: "https://fred.stlouisfed.org/data/LRUNTTTTIEA156S"
        quote: "| 2012-01-01 | 15.449740 |"
