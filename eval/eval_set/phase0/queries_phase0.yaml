# E1 Phase 0 parts and references (PLAN.md "Phase 0"). Written 2026-11-24/25 from web search and Europe PMC abstracts,
# WITHOUT opening any saved report. Burned queries: not time-anchored, so `period` is stated in each ref where it matters.
# verified_by: "abstract" = quote copied from the Europe PMC / publisher abstract; "page" = fetched page; "snippet" = search
# snippet only (weakest; flagged for the user's reference check).
# Fallback frame (rubric redo): the 12 W8 reports in eval/writer_defects/w8_runs.tsv column 5 (queries acad, c2, leave).

- id: acad
  cat: comparison
  q: "What does peer-reviewed research report about the effects of Chile's 2016 food labelling and advertising law and Mexico's 2020 front-of-package warning labels on purchases of sugary drinks, and how do the two effects compare?"
  parts:
    - id: acad.chile
      type: figure
      text: "Effect of Chile's 2016 law on purchases of sugary (high-in) drinks, from peer-reviewed research"
      ref:
        statement: "Household purchases of high-in beverages fell by 22.8 mL per capita per day after the law, about 23.7% vs the pre-law trend counterfactual (Taillie et al. 2020, PLoS Med, Kantar panel 2015-2017)."
        value: "-22.8 mL/capita/day (-23.7%)"
        alt_values: ["about -24% volume", "-27.5% calories from high-in beverages", "about a quarter fewer high-in beverage purchases"]
        url: "https://doi.org/10.1371/journal.pmed.1003015"
        quote: "Compared to the counterfactual, the volume of high-in beverage purchases decreased 22.8 mL/capita/day, postregulation"
        accessed: "2026-11-25"
        source_class: peer_reviewed
        verified_by: abstract
    - id: acad.mexico
      type: figure
      text: "Effect of Mexico's 2020 warning labels on purchases of sugary drinks, from peer-reviewed research"
      ref:
        statement: "Peer-reviewed evidence is mainly self-reported: in the 2020-2021 International Food Policy Study, 44.8% of adults said the labels made them buy less unhealthy food, with sugary drinks (cola, regular and diet soda) the largest category (about half of adults). A sales-based study (Social Science & Medicine) found reductions in calories (-15%) and added sugars (-25%) across all packaged foods and beverages combined, with no beverage-only figure. Any of these, correctly attributed, answers the part."
        value: null
        alt_values: ["44.8% of adults reported buying less unhealthy food", "about 50% of adults reported buying fewer sugary drinks", "-15% calories / -25% added sugars sold (all packaged foods and beverages)"]
        url: "https://doi.org/10.1186/s12966-024-01609-3"
        quote: "Overall, 44.8% of adults and 38.7% of youth reported buying less of unhealthy food categories due to the implementation of WL, with the largest proportion reporting decreased purchases of cola, regular and diet soda."
        accessed: "2026-11-25"
        source_class: peer_reviewed
        verified_by: abstract
    - id: acad.cmp
      type: comparison
      text: "Chile vs Mexico on the size of the effect on sugary-drink purchases, or a reasoned not-comparable statement"
      sides: ["Chile 2016 law", "Mexico 2020 warning labels"]
      measure: "effect on sugary-drink purchases"
      ref:
        statement: "Not directly comparable: Chile's estimate is a measured purchase change (about -24% volume of high-in beverages), while Mexico's peer-reviewed evidence is self-reported purchase reduction or sales of all packaged products combined; different designs and measures. A report that states both figures and says Chile's measured effect is the larger/better-evidenced one, while noting the design difference, also answers."
        value: null
        alt_values: []
        url: "https://doi.org/10.1371/journal.pmed.1003015"
        quote: "Purchases of high-in beverages significantly declined following implementation of Chile's Law of Food Labeling and Advertising"
        accessed: "2026-11-25"
        source_class: peer_reviewed
        verified_by: abstract

- id: c2
  cat: comparison
  q: "Does semaglutide reduce alcohol consumption in people with alcohol use disorder, and how does the evidence compare with naltrexone?"
  parts:
    - id: c2.sema
      type: fact
      text: "Whether semaglutide reduces alcohol consumption in people with alcohol use disorder (trial evidence)"
      ref:
        statement: "One phase 2 RCT (Hendershot et al. 2025, JAMA Psychiatry, n=48, 9 weeks): semaglutide reduced alcohol consumed in a lab self-administration task (primary) and drinks per drinking day (beta -0.41), but not drinks per calendar day or number of drinking days. Early, small evidence."
        value: null
        alt_values: ["reduced grams of alcohol in lab task (beta -0.48)", "reduced drinks per drinking day (beta -0.41)"]
        url: "https://doi.org/10.1001/jamapsychiatry.2024.4789"
        quote: "Semaglutide treatment did not affect average drinks per calendar day or number of drinking days, but significantly reduced drinks per drinking day"
        accessed: "2026-11-25"
        source_class: peer_reviewed
        verified_by: abstract
    - id: c2.naltrexone
      type: figure
      text: "Effect of naltrexone on drinking in alcohol use disorder (trial/meta-analytic evidence)"
      ref:
        statement: "Meta-analysis of RCTs (Jonas et al. 2014, JAMA; 53 naltrexone studies): oral naltrexone 50 mg/d NNT 12 to prevent return to heavy drinking and NNT 20 for return to any drinking."
        value: "NNT 12 (heavy drinking); NNT 20 (any drinking)"
        alt_values: ["NNT 11 for return to heavy drinking (McPheeters et al. 2023 update)", "risk difference -0.09 for heavy drinking"]
        url: "https://doi.org/10.1001/jama.2014.3628"
        quote: "The NNT to prevent return to heavy drinking was 12 (95% CI, 8 to 26; RD -0.09; 95% CI, -0.13 to -0.04) for oral naltrexone (50 mg/d)."
        accessed: "2026-11-25"
        source_class: peer_reviewed
        verified_by: abstract
    - id: c2.cmp
      type: comparison
      text: "Semaglutide vs naltrexone on strength of evidence for reducing drinking, or a reasoned not-comparable statement"
      sides: ["semaglutide", "naltrexone"]
      measure: "strength of evidence for reducing drinking"
      ref:
        statement: "Naltrexone's evidence is much stronger and established (dozens of RCTs, meta-analyses, approved treatment); semaglutide rests on one small phase 2 trial with mixed outcomes; no head-to-head trial exists, so effect sizes are not directly comparable."
        value: null
        alt_values: []
        url: "https://doi.org/10.1001/jama.2014.3628"
        quote: "Most assessed acamprosate (27 studies, n = 7519), naltrexone (53 studies, n = 9140), or both."
        accessed: "2026-11-25"
        source_class: peer_reviewed
        verified_by: abstract

