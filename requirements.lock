# Reproducibility snapshot (second full audit item E12, 2026-07-12) — the exact transitive
# dependency versions verified working together via a real `pip install -e .` into a clean venv.
# Informational, not installed from directly: pyproject.toml's floor+ceiling pins are the actual
# install contract. Regenerate after any real dependency bump:
#   python3 -m venv /tmp/lockenv && \
#     /tmp/lockenv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu && \
#     /tmp/lockenv/bin/pip install -e ".[dev,api,browser,pdf]" && \
#     /tmp/lockenv/bin/pip freeze | grep -v '^-e ' > requirements.lock
# The CPU-torch step MUST run before `pip install -e .` (added 2026-07-12 alongside
# sentence-transformers) — otherwise pip resolves the default CUDA-enabled torch build (~6GB vs.
# ~200MB for CPU-only), even though grounding.py's NLI usage is explicitly device="cpu" and never
# touches a GPU.
#
# Regenerated 2026-10-17 (was stale: missing minicheck/accelerate entirely, added 2026-08-29/30 --
# 2026-10-17 audit finding) from the existing long-lived ~/.venvs/deepdelve dev venv, NOT a fresh
# /tmp venv as the recipe above describes -- this environment has no `python3-venv`/ensurepip
# package installed and installing one is a system-level change outside this change's scope.
# ~/.venvs/deepdelve already carries every dependency this project uses (base + dev + api +
# browser + pdf extras) at versions the full test suite (`run_tests.py --clean --strict`, 25/25)
# passes against, which satisfies this file's actual purpose (a real, working combination) even
# though it isn't byte-for-byte the documented regeneration path. Next regeneration should use the
# documented /tmp venv recipe once that's available again, not perpetuate this shortcut.
#
# The large agent-framework-* provider list (a2a, azure, bedrock, foundry, ...) is NOT something
# this project chose to depend on directly — it's agent-framework's own bundled transitive
# dependency tree; only OpenAIChatCompletionClient (pointed at Ollama's OpenAI-compat endpoint) is
# actually used (src/engine/orchestrator.py).
