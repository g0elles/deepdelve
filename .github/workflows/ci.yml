name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Exercises the packaging fix from 5dcc4d7 (pyproject.toml's package-dir/py-modules layout)
      # as a side effect — a broken install here is exactly the bug that shipped silently before
      # CI existed, caught by hand instead of automatically. `api` extra (fastapi/uvicorn/
      # python-multipart) is needed because test_api.py hard-imports `api` -- `browser`/`pdf`
      # aren't (playwright/weasyprint are both soft-imported, fail-open at runtime, and no test
      # exercises the real binary) so they stay out of CI's install.
      - name: Install project (editable, with dev+api extras)
        run: pip install -e ".[dev,api]"

      - name: ruff check
        run: ruff check .

      # 2026-10-17 audit finding: CI previously ran only 2 of 27 test files (structural + tools),
      # never run_tests.py itself. --clean = fresh HOME and HF offline, what a clean clone sees.
      # NOT --strict here: a CI runner has no cached HuggingFace models (NLI, reranker, embedder),
      # so the scenarios that need one print SKIPPED instead of running, and --strict turns every
      # SKIPPED into a failure (first branch run, 2026-10-22: 3 files failed that way). Run
      # `python run_tests.py --clean --strict` locally, where the models are cached, to cover them.
      - name: Full test suite (run_tests.py)
        run: python run_tests.py --clean

      # Non-blocking (|| true): this codebase makes heavy, deliberate use of function-local
      # imports (lazy loading / breaking circular imports -- see pyproject.toml's own ruff-scope
      # comment) and a from-scratch strict pass would be mostly noise to sort through, not a
      # real gate yet. Surfaced in CI output so real type errors are visible without blocking
      # merges on a tool that was never tuned for this codebase's style.
      - name: Type check (advisory, non-blocking)
        run: pip install mypy && mypy --ignore-missing-imports --follow-imports=silent src || true
